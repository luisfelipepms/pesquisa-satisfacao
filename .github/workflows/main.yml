name: Deploy React Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build the React app
        working-directory: frontend
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy Frontend to EC2
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" frontend/dist/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/pesquisa-satisfacao-app/frontend/dist

      - name: Deploy Backend to EC2
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \backend/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/pesquisa-satisfacao-app/backend

      - name: SSH into EC2 and restart backend
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ubuntu/pesquisa-satisfacao-app/backend
            npm install
            npm run build
            pm2 restart backend || pm2 start dist/main.js --name backend
          EOF
